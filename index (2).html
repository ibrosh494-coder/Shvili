<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Подтверждение брони — Швили</title>
<meta name="robots" content="noindex, nofollow">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    min-height:100vh;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 0%, #123324 0%, #0a2018 60%, #061410 100%);
    font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
    padding:20px;
  }
  .card{
    max-width:440px;width:100%;
    background:linear-gradient(165deg,#0f2a1f,#081c15);
    border:1px solid rgba(255,255,255,0.1);
    border-radius:20px;
    padding:44px 34px;
    text-align:center;
    box-shadow:0 30px 80px rgba(0,0,0,0.5);
  }
  .logo{font-size:22px;font-weight:700;letter-spacing:5px;color:#fff;margin-bottom:28px}
  .logo span{color:#d4a843}
  .icon{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 22px;font-size:30px}
  .icon.ok{background:rgba(40,168,120,0.16);color:#5fcf9f}
  .icon.warn{background:rgba(212,168,67,0.16);color:#d4a843}
  .icon.err{background:rgba(220,80,60,0.16);color:#e8917f}
  h1{font-size:19px;color:#fff;margin-bottom:10px;font-weight:700}
  p{font-size:14px;color:rgba(255,255,255,0.55);line-height:1.6}
  .spinner{width:34px;height:34px;border:3px solid rgba(255,255,255,0.15);border-top-color:#d4a843;border-radius:50%;margin:0 auto 22px;animation:spin 0.8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
  <div class="card" id="card">
    <div class="logo">SH<span>V</span>ILI</div>
    <div class="spinner" id="spinner"></div>
    <h1 id="title">Проверяем бронь…</h1>
    <p id="text">Пожалуйста, подождите пару секунд.</p>
  </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://konqistuionjvoiwgmhw.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_tJAJ9BenNQngjc8Fb_vMnw_5rbVtsex";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

function render(iconClass, iconChar, title, text) {
  document.getElementById('spinner').remove();
  const card = document.getElementById('card');
  const icon = document.createElement('div');
  icon.className = 'icon ' + iconClass;
  icon.textContent = iconChar;
  card.insertBefore(icon, document.getElementById('title'));
  document.getElementById('title').textContent = title;
  document.getElementById('text').textContent = text;
}

async function run() {
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  const token = params.get('token');

  if (!id || !token) {
    render('err', '✕', 'Неверная ссылка', 'В ссылке не хватает данных. Проверьте, что вы открыли её полностью из письма.');
    return;
  }

  try {
    const { data, error } = await sb.rpc('confirm_booking', { p_id: id, p_token: token });
    if (error) throw error;

    if (data === 'confirmed') {
      render('ok', '✓', 'Бронь подтверждена', 'Гость увидит обновлённый статус в своём личном кабинете на сайте.');
    } else if (data === 'already') {
      render('ok', '✓', 'Уже подтверждена', 'Эта бронь была подтверждена ранее — повторно ничего делать не нужно.');
    } else {
      render('err', '✕', 'Ссылка недействительна', 'Не удалось найти эту бронь. Возможно, ссылка повреждена или устарела.');
    }
  } catch (err) {
    render('err', '✕', 'Ошибка', err.message || 'Что-то пошло не так. Попробуйте открыть ссылку ещё раз.');
  }
}
run();
</script>
</body>
</html>
